
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A365D"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE875"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
  </defs>

  <!-- Deep royal-blue background -->
  <rect width="108" height="108" fill="url(#blue)"/>

  <!-- Subtle compass rings -->
  <circle cx="54" cy="54" r="43"
          fill="none" stroke="#FFFFFF" stroke-opacity=".07" stroke-width=".7"/>
  <circle cx="54" cy="54" r="35"
          fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width=".7"/>

  <!-- Gold compass ring -->
  <circle cx="54" cy="54" r="28"
          fill="none" stroke="url(#gold)" stroke-width="3.5"/>

  <!-- Four-point compass rose -->
  <path d="M54 31 L58 51 L77 54 L58 57
           L54 77 L50 57 L31 54 L50 51 Z"
        fill="url(#gold)"/>

  <!-- Dark inner facets for definition -->
  <path d="M54 31 L54 54 L50 51 Z" fill="#FFF1A8" opacity=".9"/>
  <path d="M54 54 L58 57 L54 77 L54 54 Z" fill="#AA7C11" opacity=".8"/>

  <!-- Compass center -->
  <circle cx="54" cy="54" r="4" fill="#FFE875"/>
  <circle cx="54" cy="54" r="1.8" fill="#AA7C11"/>
</svg>
